<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cosmo Veterinaria — Facturación</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0a2342;
  --navy-mid: #1a3a5c;
  --blue: #1e6fa0;
  --blue-light: #2e9ed6;
  --blue-pale: #e8f4fd;
  --blue-soft: #cce6f7;
  --accent: #0fb4e7;
  --white: #ffffff;
  --bg: #f0f7ff;
  --card: #ffffff;
  --sidebar: #0a2342;
  --sidebar-hover: #1a3a5c;
  --text: #1a3a5c;
  --text-light: #5a8ab0;
  --border: #cce6f7;
  --shadow: 0 2px 12px rgba(10,35,66,0.08);
  --radius: 12px;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --amber: #d97706;
  --amber-bg: #fef3c7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; font-size: 14px; }

/* LOGIN */
#loginScreen {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, var(--blue-light) 100%);
  display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
}
.login-box {
  background: white; border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25); text-align: center;
}
.login-logo { font-size: 48px; margin-bottom: 8px; }
.login-box h1 { font-family: 'Poppins', sans-serif; font-size: 22px; color: var(--navy); margin-bottom: 4px; }
.login-box p { color: var(--text-light); font-size: 13px; margin-bottom: 24px; }
.login-box input {
  width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: 9px;
  font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--text); margin-bottom: 12px;
  outline: none; transition: border-color .2s;
}
.login-box input:focus { border-color: var(--blue-light); }
.login-box .btn-login {
  width: 100%; padding: 12px; background: linear-gradient(90deg, var(--navy), var(--blue-light));
  color: white; border: none; border-radius: 9px; font-size: 15px; font-weight: 700;
  font-family: 'Nunito', sans-serif; cursor: pointer; transition: opacity .2s;
}
.login-box .btn-login:hover { opacity: .88; }
#loginError { color: var(--red); font-size: 12.5px; margin-top: 10px; display: none; }

/* LAYOUT */
#app { display: none; width: 100%; }
.sidebar {
  width: 240px; min-height: 100vh; background: var(--sidebar);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100;
  transition: transform 0.25s ease;
}
.sidebar-logo {
  padding: 22px 18px 18px; border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-logo .logo-icon { font-size: 28px; }
.sidebar-logo h2 { color: white; font-size: 16px; font-weight: 800; line-height: 1.2; }
.sidebar-logo small { color: var(--blue-light); font-size: 11px; }
.sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
.nav-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: rgba(255,255,255,0.35);
  text-transform: uppercase; padding: 12px 10px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 8px;
  color: rgba(255,255,255,0.7); cursor: pointer; transition: all .15s; margin-bottom: 2px;
  font-size: 13.5px; font-weight: 600; border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--sidebar-hover); color: white; }
.nav-item.active { background: var(--blue-light); color: white; }
.nav-icon { font-size: 16px; width: 18px; text-align: center; }
.sidebar-footer {
  padding: 14px 12px; border-top: 1px solid rgba(255,255,255,0.1);
}
.sync-status {
  display: flex; align-items: center; gap: 7px; padding: 6px 10px;
  background: rgba(255,255,255,0.08); border-radius: 8px; margin-bottom: 8px;
  font-size: 11.5px; color: rgba(255,255,255,0.6);
}
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; }
.sync-dot.ok { background: #4ade80; }
.sync-dot.syncing { background: #fbbf24; animation: blink 1s infinite; }
.sync-dot.error { background: #f87171; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.logout-btn {
  width: 100%; padding: 9px; background: rgba(255,255,255,0.08); border: none;
  color: rgba(255,255,255,0.6); border-radius: 8px; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
}
.logout-btn:hover { background: rgba(255,255,255,0.15); color: white; }

.main { margin-left: 240px; flex: 1; min-height: 100vh; }
#topbar {
  height: 54px; background: white; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 22px; gap: 12px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700; color: var(--navy); flex: 1; }
#pageContent { padding: 20px 22px; }

.mobile-toggle {
  display: none; background: none; border: none; cursor: pointer;
  font-size: 20px; color: var(--navy); padding: 4px;
}
.sidebar-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99;
}

/* CARDS */
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-header h3 { font-size: 14.5px; font-weight: 700; color: var(--navy); }
.card-body { padding: 18px 20px; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 18px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
}
.stat-icon { font-size: 32px; }
.stat-info h3 { font-size: 20px; font-weight: 800; color: var(--navy); }
.stat-info p { font-size: 11.5px; color: var(--text-light); font-weight: 600; margin-top: 2px; }

/* FORMS */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1/-1; }
label { font-size: 12.5px; font-weight: 700; color: var(--navy); }
input, select, textarea {
  padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  font-family: 'Nunito', sans-serif; font-size: 13.5px; color: var(--text);
  outline: none; transition: border-color .15s; background: white;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(46,158,214,0.1); }
textarea { resize: vertical; min-height: 70px; }

/* BUTTONS */
.btn {
  padding: 9px 18px; border-radius: 8px; border: none; font-family: 'Nunito', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--blue); color: white; }
.btn-primary:hover { background: var(--navy-mid); }
.btn-navy { background: var(--navy); color: white; }
.btn-navy:hover { background: var(--navy-mid); }
.btn-outline { background: white; color: var(--blue); border: 1.5px solid var(--blue-soft); }
.btn-outline:hover { background: var(--blue-pale); }
.btn-ghost { background: transparent; color: var(--text-light); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--bg); }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid #fca5a5; }
.btn-success { background: var(--green-bg); color: var(--green); border: 1px solid #86efac; }
.btn-warn { background: var(--amber-bg); color: var(--amber); border: 1px solid #fcd34d; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

/* TABLES */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  padding: 10px 14px; text-align: left; background: var(--bg); color: var(--navy);
  font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px;
  border-bottom: 2px solid var(--border);
}
td { padding: 10px 14px; border-bottom: 1px solid #f0f7ff; vertical-align: middle; }
tr:hover td { background: var(--blue-pale); }

/* BADGES */
.badge {
  padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 3px;
}
.badge-blue { background: var(--blue-pale); color: var(--blue); }
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-amber { background: var(--amber-bg); color: var(--amber); }
.badge-gray { background: var(--bg); color: var(--text-light); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10,35,66,0.45); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.active { display: flex; animation: fadeIn .15s ease; }
.modal {
  background: white; border-radius: 16px; width: 100%; max-width: 560px;
  max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: slideUp .2s ease;
}
.modal-lg { max-width: 760px; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.modal-header {
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: white; z-index: 1; border-radius: 16px 16px 0 0;
}
.modal-header h3 { font-size: 15px; font-weight: 700; color: var(--navy); }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-light); padding: 4px; border-radius: 6px; }
.modal-close:hover { background: var(--bg); }
.modal-body { padding: 18px 22px; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* TOAST */
#toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  background: var(--navy); color: white; padding: 12px 20px;
  border-radius: 10px; font-weight: 700; font-size: 13.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  transform: translateY(100px); opacity: 0; transition: all .3s;
  max-width: 320px;
}
#toast.show { transform: translateY(0); opacity: 1; }

/* SEARCH PRODUCT */
.search-product-wrap { position: relative; }
.dropdown-products {
  position: absolute; top: 100%; left: 0; right: 0; background: white;
  border: 1.5px solid var(--blue-light); border-radius: 9px; max-height: 240px;
  overflow-y: auto; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: none;
}
.dropdown-item {
  padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
  font-size: 13px; transition: background .1s;
}
.dropdown-item:hover { background: var(--blue-pale); }
.dropdown-item:last-child { border-bottom: none; }
.drop-price { color: var(--blue); font-weight: 700; }

/* FACTURA LAYOUT */
.factura-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.totals-box { background: var(--bg); border-radius: 10px; padding: 16px; }
.total-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--border); }
.total-row.grand { font-size: 20px; font-weight: 800; color: var(--navy); border: none; padding-top: 10px; }

/* CHARTS */
.chart-bar-wrap { display: flex; align-items: flex-end; gap: 4px; height: 100px; margin-top: 12px; }
.chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.chart-bar { width: 100%; background: var(--blue); border-radius: 4px 4px 0 0; min-height: 3px; }
.chart-bar.egreso { background: var(--amber); }
.chart-label { font-size: 9.5px; color: var(--text-light); font-weight: 700; }

/* TABS */
.tabs { display: flex; gap: 3px; margin-bottom: 16px; background: var(--bg); padding: 4px; border-radius: 10px; width: fit-content; }
.tab-btn { padding: 8px 18px; border-radius: 7px; border: none; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; background: transparent; color: var(--text-light); }
.tab-btn.active { background: white; color: var(--navy); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }

/* LOW STOCK */
.low-stock td { color: var(--amber); background: var(--amber-bg) !important; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 40px 20px; }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text-light); }

/* ABONO */
.abono-item {
  background: var(--bg); border-radius: 8px; padding: 9px 14px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--border); font-size: 13px; margin-bottom: 6px;
}

/* ALERT */
.alert { padding: 10px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; margin-bottom: 14px; }
.alert-warn { background: var(--amber-bg); color: var(--amber); border: 1px solid #fcd34d; }
.alert-success { background: var(--green-bg); color: var(--green); border: 1px solid #86efac; }
.alert-danger { background: var(--red-bg); color: var(--red); border: 1px solid #fca5a5; }

/* SEARCH BAR */
.search-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.search-bar input { flex: 1; min-width: 180px; }
.search-bar select { min-width: 140px; }
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-wrap .sicon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 14px; }
.search-wrap input { padding-left: 32px; width: 100%; }

/* DIVIDER */
.section-div { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-light); display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; }
.section-div::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* RESPONSIVE */
@media(max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-backdrop.show { display: block; }
  .mobile-toggle { display: flex; }
  .main { margin-left: 0; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .factura-layout { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  #pageContent { padding: 14px 14px; }
}
@media(max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { padding: 12px; }
  .stat-info h3 { font-size: 16px; }
  .card-body { padding: 12px 14px; }
  .modal { max-width: 100%; border-radius: 16px 16px 0 0; align-self: flex-end; margin: 0; }
  .modal-overlay { align-items: flex-end; padding: 0; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🐾</div>
    <h1>Cosmo Veterinaria</h1>
    <p>Sistema de Facturación & Gestión</p>
    <input type="email" id="loginUser" placeholder="Usuario" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn-login" onclick="doLogin()">Ingresar →</button>
    <div id="loginError">Usuario o contraseña incorrectos</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar-backdrop" id="backdrop" onclick="closeSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🐾</div>
      <div><h2>Cosmo</h2><small>Veterinaria</small></div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <button class="nav-item active" onclick="goTo('dashboard',this)"><span class="nav-icon">📊</span>Dashboard</button>
      <button class="nav-item" onclick="goTo('facturacion',this)"><span class="nav-icon">🧾</span>Facturación</button>
      <button class="nav-item" onclick="goTo('pendientes',this)"><span class="nav-icon">⏳</span>Cuentas Pendientes</button>
      <div class="nav-section-label">Gestión</div>
      <button class="nav-item" onclick="goTo('clientes',this)"><span class="nav-icon">👥</span>Clientes</button>
      <button class="nav-item" onclick="goTo('inventario',this)"><span class="nav-icon">📦</span>Inventario</button>
      <button class="nav-item" onclick="goTo('productos',this)"><span class="nav-icon">🏷️</span>Productos</button>
      <div class="nav-section-label">Finanzas</div>
      <button class="nav-item" onclick="goTo('gastos',this)"><span class="nav-icon">💸</span>Gastos / Compras</button>
      <button class="nav-item" onclick="goTo('costos',this)"><span class="nav-icon">📈</span>Historial de Costos</button>
      <button class="nav-item" onclick="goTo('reportes',this)"><span class="nav-icon">📋</span>Reportes</button>
    </div>
    <div class="sidebar-footer">
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncText">Sin sincronizar</span>
      </div>
      <button class="logout-btn" onclick="doLogout()">🚪 Cerrar sesión</button>
    </div>
  </nav>

  <div class="main">
    <div id="topbar">
      <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div id="topbarActions"></div>
    </div>
    <div id="pageContent"></div>
  </div>
</div>

<!-- MODALES -->
<div class="modal-overlay" id="modalCliente">
  <div class="modal">
    <div class="modal-header"><h3 id="tituloCliente">Nuevo Cliente</h3><button class="modal-close" onclick="closeModal('modalCliente')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="cliId">
      <div class="form-grid">
        <div class="form-group full"><label>Nombre completo *</label><input id="cliNombre" placeholder="Nombre del cliente"></div>
        <div class="form-group"><label>Cédula</label><input id="cliCedula" placeholder="Número documento"></div>
        <div class="form-group"><label>Teléfono</label><input id="cliTel" placeholder="Celular"></div>
        <div class="form-group full"><label>Email</label><input type="email" id="cliEmail" placeholder="correo@email.com"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modalCliente')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarCliente()">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalProducto">
  <div class="modal">
    <div class="modal-header"><h3 id="tituloProd">Nuevo Producto/Servicio</h3><button class="modal-close" onclick="closeModal('modalProducto')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="prodId">
      <div class="form-grid">
        <div class="form-group"><label>Categoría *</label>
          <select id="prodCat"><option>Petshop</option><option>Consultorio</option><option>Peluquería</option></select>
        </div>
        <div class="form-group"><label>Tipo *</label>
          <select id="prodTipo"><option value="P">Producto</option><option value="S">Servicio</option></select>
        </div>
        <div class="form-group"><label>Código *</label><input id="prodCodigo" placeholder="Código o barcode"></div>
        <div class="form-group"><label>Precio de Venta *</label><input type="number" id="prodPrecio" placeholder="0" min="0"></div>
        <div class="form-group full"><label>Nombre *</label><input id="prodNombre" placeholder="Nombre del producto"></div>
        <div class="form-group"><label>Stock Inicial</label><input type="number" id="prodStock" value="0" min="0"></div>
        <div class="form-group"><label>Stock Mínimo</label><input type="number" id="prodStockMin" value="5" min="0"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modalProducto')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarProducto()">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalGasto">
  <div class="modal">
    <div class="modal-header"><h3>Registrar Gasto / Compra</h3><button class="modal-close" onclick="closeModal('modalGasto')">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Tipo *</label>
          <select id="gastoTipo" onchange="onGastoTipo()">
            <option value="compra">🛍️ Compra de Inventario</option>
            <option value="gasto">💸 Gasto Operativo</option>
          </select>
        </div>
        <div class="form-group"><label>Categoría *</label>
          <select id="gastoCat">
            <option value="inventario">Inventario</option><option value="nomina">Nómina</option>
            <option value="impuestos">Impuestos</option><option value="papeleria">Papelería</option>
            <option value="servicios">Servicios Públicos</option><option value="arriendo">Arriendo</option>

function scheduleSync() {

}

async function pushToSheets() {
  syncStatus = 'syncing'; updateSyncUI();
  try {
    for (const s of STORES_SYNC) {

}

async function pullFromSheets() {
  syncStatus = 'syncing'; updateSyncUI();
  try {

}

function updateSyncUI() {

  else if (syncStatus==='error') txt.textContent = 'Error sync';
  else txt.textContent = 'Google Sheets';
}

function load(k, def) { try { const v=localStorage.getItem('cosmo_'+k); return v ? JSON.parse(v) : def; } catch { return def; } }
function save(k, v) { localStorage.setItem('cosmo_'+k, JSON.stringify(v)); scheduleSync(); }

const DB = {
  get productos() { return load('productos', PROD_DATA); },
  set productos(v) { save('productos', v); },
  get clientes() { return load('clientes', []); },
  set clientes(v) { save('clientes', v); },
  get facturas() { return load('facturas', []); },
  set facturas(v) { save('facturas', v); },
  get preCuentas() { return load('preCuentas', []); },
  set preCuentas(v) { save('preCuentas', v); },
  get gastos() { return load('gastos', []); },
  set gastos(v) { save('gastos', v); },
  get costos() { return load('costos', []); },
  set costos(v) { save('costos', v); },
};

if (!localStorage.getItem('cosmo_productos')) save('productos', PROD_DATA);

const fmt = n => '$' + Math.round(n||0).toLocaleString('es-CO');
const today = () => new Date().toISOString().split('T')[0];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

function showToast(msg, color='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color || 'var(--navy)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

function openModal(id) { document.getElementById(id).classList.add('active'); document.body.style.overflow='hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow=''; }

// AUTH

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if (u === CREDS.user && p === CREDS.pass) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('gastoFecha').value = today();
    goTo('dashboard', document.querySelector('.nav-item'));
    setTimeout(pullFromSheets, 800);
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') { if(document.getElementById('loginScreen').style.display!=='none') doLogin(); } });

function doLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

let currentPage = 'dashboard';
function goTo(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const titles = { dashboard:'Dashboard', facturacion:'Facturación', pendientes:'Cuentas Pendientes', clientes:'Clientes', inventario:'Inventario', productos:'Productos y Servicios', gastos:'Gastos y Compras', costos:'Historial de Costos', reportes:'Reportes' };
  document.getElementById('topbarTitle').textContent = titles[page] || page;
  document.getElementById('topbarActions').innerHTML = '';
  const renders = { dashboard:renderDashboard, facturacion:renderFacturacion, pendientes:renderPendientes, clientes:renderClientes, inventario:renderInventario, productos:renderProductos, gastos:renderGastos, costos:renderCostos, reportes:renderReportes };
  if (renders[page]) renders[page]();
  closeSidebar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

// DASHBOARD
// ══════════════════════════════════════════
function renderDashboard() {
  const now = new Date(); const mes = now.getMonth(); const ano = now.getFullYear();
  const facturas = DB.facturas;
  const preCuentas = DB.preCuentas;
  const gastos = DB.gastos;
  const ventasMes = facturas.filter(f => { const d=new Date(f.fecha); return d.getMonth()===mes && d.getFullYear()===ano; });
  const totalVentas = ventasMes.reduce((s,f) => s+f.total, 0);
  const gastosMes = gastos.filter(g => { const d=new Date(g.fecha); return d.getMonth()===mes && d.getFullYear()===ano; });
  const totalGastos = gastosMes.reduce((s,g) => s+g.monto, 0);
  const pendiente = preCuentas.filter(p=>p.estado!=='pagado').reduce((s,p)=>s+(p.total-p.pagado),0);
  const utilidad = totalVentas - totalGastos;

  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().split('T')[0]); }
  const maxV = Math.max(...days.map(d => Math.max(
    facturas.filter(f=>f.fecha===d).reduce((s,f)=>s+f.total,0),
    gastos.filter(g=>g.fecha===d).reduce((s,g)=>s+g.monto,0)
  )), 1);

  const lowStock = DB.productos.filter(p => p.t==='P' && p.s <= p.sm);
  const ultFact = [...facturas].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5);

  document.getElementById('pageContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-info"><h3>${fmt(totalVentas)}</h3><p>Ventas del Mes</p></div></div>
      <div class="stat-card"><div class="stat-icon">📤</div><div class="stat-info"><h3>${fmt(totalGastos)}</h3><p>Gastos del Mes</p></div></div>
      <div class="stat-card"><div class="stat-icon">📈</div><div class="stat-info"><h3 style="color:${utilidad>=0?'var(--green)':'var(--red)'}">${fmt(utilidad)}</h3><p>Utilidad Mes</p></div></div>
      <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-info"><h3 style="color:var(--amber)">${fmt(pendiente)}</h3><p>Por Cobrar</p></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card">
        <div class="card-header"><h3>Ventas vs Gastos — 7 días</h3></div>
        <div class="card-body">
          <div style="display:flex;gap:12px;margin-bottom:8px">
            <span style="font-size:11px;color:var(--blue)">■ Ventas</span>
            <span style="font-size:11px;color:var(--amber)">■ Gastos</span>
          </div>
          <div class="chart-bar-wrap">
            ${days.map(d => {
              const v = facturas.filter(f=>f.fecha===d).reduce((s,f)=>s+f.total,0);
              const g = gastos.filter(x=>x.fecha===d).reduce((s,x)=>s+x.monto,0);
              return `<div class="chart-bar-col">
                <div style="display:flex;gap:2px;align-items:flex-end;height:90px">
                  <div class="chart-bar" style="height:${Math.round(v/maxV*90)}%;width:12px" title="${fmt(v)}"></div>
                  <div class="chart-bar egreso" style="height:${Math.round(g/maxV*90)}%;width:12px" title="${fmt(g)}"></div>
                </div>
                <span class="chart-label">${d.slice(8)}</span>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Últimas ventas</h3><button class="btn btn-ghost btn-sm" onclick="goTo('facturacion',document.querySelectorAll('.nav-item')[1])">Ver todo</button></div>
        <div>
          ${ultFact.length ? ultFact.map(f=>`<div style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
            <div><div style="font-weight:700;font-size:13px">${f.clienteNombre}</div><div style="font-size:11px;color:var(--text-light)">${f.fecha} · ${f.numero}</div></div>
            <div style="font-weight:800;color:var(--navy)">${fmt(f.total)}</div>
          </div>`).join('') : '<div class="empty-state"><div class="empty-icon">🧾</div><div class="empty-title">Sin ventas aún</div></div>'}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3>⚠️ Stock bajo (${lowStock.length} productos)</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Stock</th><th>Mínimo</th></tr></thead>
          <tbody>
            ${lowStock.slice(0,10).map(p=>`<tr class="low-stock"><td>${p.id}</td><td>${p.n}</td><td>${p.c}</td>
              <td><span class="badge ${p.s<=0?'badge-red':'badge-amber'}">${p.s}</span></td><td>${p.sm}</td></tr>`).join('')
            || '<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--text-light)">Sin productos con stock bajo ✅</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

function onClienteTipo() {
  const t = document.getElementById('factClienteTipo').value;
  document.getElementById('factClienteSearch').style.display = t==='registrado'?'flex':'none';
  document.getElementById('factClienteInfo').style.display = 'none';
  factClienteId = null;
}

function onClienteSelect() {
  const id = document.getElementById('factClienteSelect').value;
  if (!id) { document.getElementById('factClienteInfo').style.display='none'; factClienteId=null; return; }
  const c = DB.clientes.find(x=>x.id===id);
  if (c) {
    factClienteId = id;
    document.getElementById('factClienteInfo').textContent = `👤 ${c.nombre} | ${c.cedula||'S/C'} | ${c.telefono||''}`;
    document.getElementById('factClienteInfo').style.display = 'block';
  }
}

function searchProd() {
  const q = document.getElementById('factProdSearch').value.toLowerCase().trim();
  const dd = document.getElementById('factProdDropdown');
  if (q.length < 2) { dd.style.display='none'; return; }
  const res = DB.productos.filter(p => p.n.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)).slice(0,25);
  dd.style.display = res.length ? 'block' : 'none';
  dd.innerHTML = res.map(p=>`<div class="dropdown-item" onclick="selectProd('${p.id}')">
    <div style="font-weight:600">${p.n}</div>
    <div style="font-size:11px;color:var(--text-light)">${p.id} · ${p.c} <span class="drop-price">${fmt(p.p)}</span></div>
  </div>`).join('');
}

function selectProd(id) {
  const p = DB.productos.find(x=>x.id===id);
  if (!p) return;
  selProd = p;
  document.getElementById('factProdSearch').value = p.n;
  document.getElementById('factPrecio').value = p.p;
  document.getElementById('factProdDropdown').style.display = 'none';
}

function addItemFactura() {
  if (!selProd) { showToast('Selecciona un producto primero','var(--red)'); return; }
  const cant = parseInt(document.getElementById('factCant').value)||1;
  const precio = parseFloat(document.getElementById('factPrecio').value)||0;
  const ex = factItems.find(i=>i.id===selProd.id);
  if (ex) { ex.cant += cant; ex.subtotal = ex.cant * ex.precio; }
  else factItems.push({ id:selProd.id, nombre:selProd.n, cant, precio, subtotal:cant*precio, tipo:selProd.t });
  selProd = null;
  document.getElementById('factProdSearch').value = '';
  document.getElementById('factCant').value = 1;
  document.getElementById('factPrecio').value = 0;
  renderFactItems();
}

function removeItem(i) { factItems.splice(i,1); renderFactItems(); }

function updateCant(i, v) {
  factItems[i].cant = parseInt(v)||1;
  factItems[i].subtotal = factItems[i].cant * factItems[i].precio;
  renderFactItems();
}

function renderFactItems() {
  const tbody = document.getElementById('factItems');
  if (!tbody) return;
  const sub = factItems.reduce((s,i)=>s+i.subtotal,0);
  tbody.innerHTML = factItems.map((item,i)=>`<tr>
    <td>${item.nombre}</td>
    <td><input type="number" value="${item.cant}" min="1" style="width:58px;padding:4px 7px;border:1.5px solid var(--border);border-radius:6px" onchange="updateCant(${i},this.value)"></td>
    <td>${fmt(item.precio)}</td>
    <td style="font-weight:700">${fmt(item.subtotal)}</td>
    <td><button class="btn btn-danger btn-sm" onclick="removeItem(${i})">✕</button></td>
  </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;padding:18px;color:var(--text-light)">Agrega productos o servicios</td></tr>';
  const totEl = document.getElementById('factSubtotal');
  const totGrand = document.getElementById('factTotal');
  if (totEl) totEl.textContent = fmt(sub);
  if (totGrand) totGrand.textContent = fmt(sub);
}

function getCliente() {
  const tipo = document.getElementById('factClienteTipo')?.value;
  if (tipo==='final') return { id:'consumidor_final', nombre:'Consumidor Final', cedula:'', telefono:'' };
  return DB.clientes.find(x=>x.id===factClienteId) || null;
}

function emitirFactura() {
  if (!factItems.length) { showToast('Agrega al menos un producto','var(--red)'); return; }
  const cliente = getCliente();
  if (!cliente) { showToast('Selecciona un cliente','var(--red)'); return; }
  const total = factItems.reduce((s,i)=>s+i.subtotal,0);
  const factura = {
    id:uid(), numero:'F-'+String(DB.facturas.length+1).padStart(4,'0'),
    fecha:today(), clienteId:cliente.id, clienteNombre:cliente.nombre,
    items:[...factItems], total, pago:document.getElementById('factPago').value,
    obs:document.getElementById('factObs').value, estado:'pagado'
  };
  const prods = DB.productos;
  factItems.forEach(item => { const p=prods.find(x=>x.id===item.id); if(p && p.t==='P') p.s -= item.cant; });
  DB.productos = prods;
  const fs = DB.facturas; fs.push(factura); DB.facturas = fs;
  showToast('✅ Factura '+factura.numero+' emitida');
  limpiarFactura();
  renderFacturacion();
}

function guardarPreCuenta() {
  if (!factItems.length) { showToast('Agrega al menos un producto','var(--red)'); return; }
  const cliente = getCliente();
  if (!cliente) { showToast('Selecciona un cliente','var(--red)'); return; }
  const total = factItems.reduce((s,i)=>s+i.subtotal,0);
  const pre = {
    id:uid(), numero:'PC-'+String(DB.preCuentas.length+1).padStart(4,'0'),
    fecha:today(), clienteId:cliente.id, clienteNombre:cliente.nombre,
    items:[...factItems], total, pagado:0, abonos:[], estado:'pendiente',
    obs:document.getElementById('factObs').value
  };
  const ps = DB.preCuentas; ps.push(pre); DB.preCuentas = ps;
  showToast('⏳ Pre-cuenta '+pre.numero+' guardada');
  limpiarFactura();
  renderFacturacion();
}

function limpiarFactura() {
  factItems = []; selProd = null; factClienteId = null;
  if (document.getElementById('factClienteTipo')) document.getElementById('factClienteTipo').value = 'final';
  if (document.getElementById('factClienteSearch')) document.getElementById('factClienteSearch').style.display='none';
  if (document.getElementById('factClienteInfo')) document.getElementById('factClienteInfo').style.display='none';
  if (document.getElementById('factProdSearch')) document.getElementById('factProdSearch').value='';
  if (document.getElementById('factObs')) document.getElementById('factObs').value='';
  renderFactItems();
}

function renderPendientes(q='') {
  const data = DB.preCuentas.filter(p => !q || p.clienteNombre.toLowerCase().includes(q.toLowerCase()));
  const total = data.filter(p=>p.estado!=='pagado').reduce((s,p)=>s+(p.total-p.pagado),0);
  document.getElementById('pageContent').innerHTML = `
    <div class="alert alert-warn" style="display:${total>0?'block':'none'}">
      💰 Total por cobrar: <strong>${fmt(total)}</strong>
    </div>
    <div class="search-bar">
      <div class="search-wrap"><span class="sicon">🔍</span><input placeholder="Buscar cliente…" value="${q}" oninput="renderPendientes(this.value)"></div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>N°</th><th>Cliente</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            ${data.length ? data.map(p => {
              const saldo = p.total - p.pagado;
              const bc = p.estado==='pagado'?'badge-green':p.pagado>0?'badge-amber':'badge-red';
              const bt = p.estado==='pagado'?'Pagado':p.pagado>0?'Abonado':'Pendiente';
              return `<tr>
                <td>${p.fecha}</td>
                <td style="font-weight:600">${p.numero}</td>
                <td><strong>${p.clienteNombre}</strong></td>
                <td>${fmt(p.total)}</td>
                <td style="color:var(--green)">${fmt(p.pagado)}</td>
                <td style="color:var(--red);font-weight:700">${fmt(saldo)}</td>
                <td><span class="badge ${bc}">${bt}</span></td>
                <td>
                  ${p.estado!=='pagado'?`<button class="btn btn-success btn-sm" onclick="abrirAbono('${p.id}')">💳 Abonar</button> `:''}
                  <button class="btn btn-ghost btn-sm" onclick="abrirAbono('${p.id}')">👁</button>
                </td>
              </tr>`;
            }).join('') : '<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-light)">Sin cuentas pendientes ✅</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

let currentPCId = null;
function abrirAbono(id) {
  currentPCId = id;
  const pc = DB.preCuentas.find(p=>p.id===id);
  if (!pc) return;
  const saldo = pc.total - pc.pagado;
  document.getElementById('modalAbonoBody').innerHTML = `
    <div class="alert alert-warn">Saldo pendiente: <strong>${fmt(saldo)}</strong></div>
    <div class="form-grid">
      <div class="form-group"><label>Monto a pagar *</label><input type="number" id="abonoMonto" max="${saldo}" min="1" placeholder="${saldo}"></div>
      <div class="form-group"><label>Fecha</label><input type="date" id="abonoFecha" value="${today()}"></div>
      <div class="form-group"><label>Método</label>
        <select id="abonoPago"><option value="efectivo">💵 Efectivo</option><option value="transferencia">📱 Transferencia</option><option value="tarjeta">💳 Tarjeta</option></select>
      </div>
    </div>
    ${pc.abonos.length ? `<div class="section-div">Pagos anteriores</div>
    ${pc.abonos.map(a=>`<div class="abono-item"><span>${a.fecha}</span><span>${a.metodo}</span><span style="font-weight:700;color:var(--green)">${fmt(a.monto)}</span></div>`).join('')}` : ''}`;
  openModal('modalAbono');
}

function guardarAbono() {
  const monto = parseFloat(document.getElementById('abonoMonto').value);
  const fecha = document.getElementById('abonoFecha').value;
  const metodo = document.getElementById('abonoPago').value;
  if (!monto || monto<=0) { showToast('Ingresa un monto válido','var(--red)'); return; }
  const pcs = DB.preCuentas;
  const pc = pcs.find(p=>p.id===currentPCId);
  if (!pc) return;
  const saldo = pc.total - pc.pagado;
  if (monto > saldo+0.01) { showToast('Monto supera el saldo','var(--red)'); return; }
  pc.abonos.push({ fecha, monto, metodo });
  pc.pagado += monto;
  if (pc.pagado >= pc.total - 0.01) {
    pc.estado = 'pagado';
    const f = { id:uid(), numero:'F-'+String(DB.facturas.length+1).padStart(4,'0'), fecha:today(), clienteId:pc.clienteId, clienteNombre:pc.clienteNombre, items:pc.items, total:pc.total, pago:metodo, obs:'Pre-cuenta '+pc.numero, estado:'pagado' };
    const prods = DB.productos;
    pc.items.forEach(item => { const p=prods.find(x=>x.id===item.id); if(p && p.t==='P') p.s -= item.cant; });
    DB.productos = prods;
    const fs = DB.facturas; fs.push(f); DB.facturas = fs;
    showToast('✅ Pago completo! Factura generada');
  } else {
    showToast(`💰 Abono ${fmt(monto)} registrado. Saldo: ${fmt(pc.total-pc.pagado)}`);
  }
  DB.preCuentas = pcs;
  closeModal('modalAbono');
  renderPendientes();
}

      <div class="table-wrap">

function guardarCliente() {
  const nombre = document.getElementById('cliNombre').value.trim();
  if (!nombre) { showToast('El nombre es obligatorio','var(--red)'); return; }
  const cs = DB.clientes;
  const id = document.getElementById('cliId').value;
  if (id) {
    const c = cs.find(x=>x.id===id);
    if (c) { c.nombre=nombre; c.cedula=document.getElementById('cliCedula').value; c.telefono=document.getElementById('cliTel').value; c.email=document.getElementById('cliEmail').value; }
  } else {
    cs.push({ id:uid(), nombre, cedula:document.getElementById('cliCedula').value, telefono:document.getElementById('cliTel').value, email:document.getElementById('cliEmail').value });
  }
  DB.clientes = cs;
  closeModal('modalCliente');
  showToast('✅ Cliente guardado');
  ['cliNombre','cliCedula','cliTel','cliEmail'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('cliId').value='';
  if (currentPage==='clientes') renderClientes();
}

function editCliente(id) {
  const c = DB.clientes.find(x=>x.id===id);
  if (!c) return;
  document.getElementById('cliId').value=id;
  document.getElementById('cliNombre').value=c.nombre||'';
  document.getElementById('cliCedula').value=c.cedula||'';
  document.getElementById('cliTel').value=c.telefono||'';
  document.getElementById('cliEmail').value=c.email||'';
  document.getElementById('tituloCliente').textContent='Editar Cliente';
  openModal('modalCliente');
}

function guardarProducto() {
  const nombre = document.getElementById('prodNombre').value.trim();
  const codigo = document.getElementById('prodCodigo').value.trim();
  if (!nombre || !codigo) { showToast('Nombre y código son obligatorios','var(--red)'); return; }
  const ps = DB.productos;
  const id = document.getElementById('prodId').value;
  if (id) {
    const p = ps.find(x=>x.id===id);
    if (p) { p.n=nombre; p.p=parseFloat(document.getElementById('prodPrecio').value)||0; p.c=document.getElementById('prodCat').value; p.t=document.getElementById('prodTipo').value; p.sm=parseInt(document.getElementById('prodStockMin').value)||5; }
  } else {
    if (ps.find(x=>x.id===codigo)) { showToast('Ya existe un producto con ese código','var(--red)'); return; }
    ps.push({ id:codigo, n:nombre, t:document.getElementById('prodTipo').value, p:parseFloat(document.getElementById('prodPrecio').value)||0, s:parseInt(document.getElementById('prodStock').value)||0, c:document.getElementById('prodCat').value, sm:parseInt(document.getElementById('prodStockMin').value)||5 });
  }
  DB.productos = ps;
  closeModal('modalProducto');
  showToast('✅ Producto guardado');
  ['prodNombre','prodCodigo','prodPrecio','prodStock','prodStockMin'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('prodId').value='';
  if (currentPage==='productos') renderProductos();
}

function editProducto(id) {
  const p = DB.productos.find(x=>x.id===id);
  if (!p) return;
  document.getElementById('prodId').value=p.id;
  document.getElementById('prodNombre').value=p.n||'';
  document.getElementById('prodCodigo').value=p.id;
  document.getElementById('prodPrecio').value=p.p||0;
  document.getElementById('prodStock').value=p.s||0;
  document.getElementById('prodStockMin').value=p.sm||5;
  document.getElementById('prodCat').value=p.c||'Petshop';
  document.getElementById('prodTipo').value=p.t||'P';
  document.getElementById('tituloProd').textContent='Editar Producto';
  openModal('modalProducto');
}

// ══════════════════════════════════════════
// GASTOS
// ══════════════════════════════════════════
let selGastoProd = null;

function onGastoTipo() {
  const t = document.getElementById('gastoTipo').value;
  document.getElementById('gastoProducotWrap').style.display = t==='compra'?'block':'none';
  document.getElementById('gastoUnidadesWrap').style.display = t==='compra'?'block':'none';
  document.getElementById('gastoCostoWrap').style.display = t==='compra'?'block':'none';
}

function searchGastoProd() {
  const q = document.getElementById('gastoProdSearch').value.toLowerCase().trim();
  const dd = document.getElementById('gastoProdDropdown');
  if (q.length < 2) { dd.style.display='none'; return; }
  const res = DB.productos.filter(p => p.t==='P' && (p.n.toLowerCase().includes(q) || p.id.toLowerCase().includes(q))).slice(0,20);
  dd.style.display = res.length?'block':'none';
  dd.innerHTML = res.map(p=>`<div class="dropdown-item" onclick="selectGastoProd('${p.id}')">
    <div style="font-weight:600">${p.n}</div>
    <div style="font-size:11px;color:var(--text-light)">${p.id}</div>
  </div>`).join('');
}

function selectGastoProd(id) {
  const p = DB.productos.find(x=>x.id===id);
  if (!p) return;
  selGastoProd = p;
  document.getElementById('gastoProdSearch').value = p.n;
  document.getElementById('gastoProdId').value = p.id;
  document.getElementById('gastoProdDropdown').style.display = 'none';
  document.getElementById('gastoDesc').value = p.n;
}

function renderGastos(q='', tipo='', cat='') {
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-navy" onclick="openModal('modalGasto')">+ Registrar</button>`;
  let list = DB.gastos;
  if (tipo) list = list.filter(g=>g.tipo===tipo);
  if (cat) list = list.filter(g=>g.cat===cat);
  if (q) list = list.filter(g=>g.desc.toLowerCase().includes(q.toLowerCase()));
  list = [...list].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const cats = { inventario:'Inventario', nomina:'Nómina', impuestos:'Impuestos', papeleria:'Papelería', servicios:'Servicios', arriendo:'Arriendo', varios:'Varios' };
  document.getElementById('pageContent').innerHTML = `
    <div class="search-bar">
      <select onchange="renderGastos('${q}',this.value,'${cat}')"><option value="">Todos los tipos</option><option value="compra">Compras</option><option value="gasto">Gastos Op.</option></select>
      <select onchange="renderGastos('${q}','${tipo}',this.value)"><option value="">Todas las categorías</option>${Object.entries(cats).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>
      <div class="search-wrap"><span class="sicon">🔍</span><input placeholder="Buscar…" value="${q}" oninput="renderGastos(this.value,'${tipo}','${cat}')"></div>
      <button class="btn btn-navy" onclick="openModal('modalGasto')">+ Registrar</button>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th>Método</th></tr></thead>
          <tbody>
            ${list.length ? list.map(g=>`<tr>
              <td>${g.fecha}</td>
              <td><span class="badge ${g.tipo==='compra'?'badge-blue':'badge-amber'}">${g.tipo==='compra'?'🛍️ Compra':'💸 Gasto'}</span></td>
              <td>${cats[g.cat]||g.cat}</td>
              <td>${g.desc}</td>
              <td style="font-weight:700;color:var(--red)">${fmt(g.monto)}</td>
              <td>${g.metodo||'—'}</td>
            </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-light)">Sin gastos registrados</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

function guardarGasto() {
  const tipo = document.getElementById('gastoTipo').value;
  const monto = parseFloat(document.getElementById('gastoMonto').value);
  const desc = document.getElementById('gastoDesc').value.trim();
  const fecha = document.getElementById('gastoFecha').value;
  if (!monto || !desc || !fecha) { showToast('Completa todos los campos','var(--red)'); return; }

  if (tipo==='compra' && selGastoProd) {
    const unidades = parseInt(document.getElementById('gastoUnidades').value)||1;
    const costoUnit = parseFloat(document.getElementById('gastoCostoUnit').value)||monto/unidades;
    const prods = DB.productos;
    const p = prods.find(x=>x.id===selGastoProd.id);
    if (p) { p.s += unidades; DB.productos = prods; }
    const cs = DB.costos;
    const prev = cs.filter(c=>c.prodId===selGastoProd.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if (prev && prev.precio !== costoUnit) {
      const v = ((costoUnit-prev.precio)/prev.precio*100).toFixed(1);
      showToast(`⚠️ Precio de costo cambió: ${fmt(prev.precio)} → ${fmt(costoUnit)} (${v>0?'+':''}${v}%)`, 'var(--amber)');
    }
    cs.push({ id:uid(), prodId:selGastoProd.id, prodNombre:selGastoProd.n, precio:costoUnit, fecha, compraId:uid() });
    DB.costos = cs;
  }

  const gs = DB.gastos;
  gs.push({ id:uid(), tipo, cat:document.getElementById('gastoCat').value, desc, monto, fecha, metodo:document.getElementById('gastoPagoMetodo').value, prodId:selGastoProd?.id||null });
  DB.gastos = gs;
  closeModal('modalGasto');
  showToast('✅ Gasto registrado');
  selGastoProd = null;
  ['gastoDesc','gastoMonto','gastoCostoUnit'].forEach(x=>document.getElementById(x).value='');
  if (document.getElementById('gastoProdSearch')) document.getElementById('gastoProdSearch').value='';
  if (currentPage==='gastos') renderGastos();
}

// ══════════════════════════════════════════
// HISTORIAL DE COSTOS
// ══════════════════════════════════════════
function renderCostos(q='') {
  const cs = [...DB.costos].sort((a,b)=>b.fecha.localeCompare(a.fecha)).filter(c=>!q||c.prodNombre.toLowerCase().includes(q.toLowerCase()));
  const prevMap = {};
  document.getElementById('pageContent').innerHTML = `
    <div class="search-bar">
      <div class="search-wrap"><span class="sicon">🔍</span><input placeholder="Buscar producto…" value="${q}" oninput="renderCostos(this.value)"></div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Producto</th><th>Fecha</th><th>Precio Costo</th><th>Anterior</th><th>Variación</th></tr></thead>
          <tbody>
            ${cs.length ? cs.map(c=>{
              const prev = prevMap[c.prodId];
              const v = prev ? ((c.precio-prev)/prev*100).toFixed(1) : null;
              prevMap[c.prodId] = c.precio;
              return `<tr>
                <td><strong>${c.prodNombre}</strong></td>
                <td>${c.fecha}</td>
                <td style="font-weight:700">${fmt(c.precio)}</td>
                <td>${prev?fmt(prev):'—'}</td>
                <td>${v!==null?`<span class="badge ${v>0?'badge-red':'badge-green'}">${v>0?'↑+':'↓'}${v}%</span>`:'—'}</td>
              </tr>`;
            }).join('') : '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-light)">Sin historial de costos</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ══════════════════════════════════════════
// REPORTES
// ══════════════════════════════════════════
function renderReportes() {
  const hoy = today();
  const primer = hoy.slice(0,8)+'01';
  document.getElementById('pageContent').innerHTML = `
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('ventas',this)">📊 Ventas</button>
      <button class="tab-btn" onclick="switchTab('gastosR',this)">💸 Gastos</button>
    </div>
    <div id="tabVentas">
      <div class="search-bar">
        <input type="date" id="repDesde" value="${primer}">
        <input type="date" id="repHasta" value="${hoy}">
        <button class="btn btn-primary" onclick="renderReporteVentas()">Filtrar</button>
      </div>
      <div class="stats-grid" id="repVentasStats" style="grid-template-columns:repeat(3,1fr)"></div>
      <div class="card" style="margin-top:14px">
        <div class="card-header"><h3>Detalle de Ventas</h3></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Fecha</th><th>N° Factura</th><th>Cliente</th><th>Items</th><th>Total</th><th>Pago</th></tr></thead>
          <tbody id="repVentasTable"></tbody>
        </table></div>
      </div>
    </div>
    <div id="tabGastosR" style="display:none">
      <div class="stats-grid" id="repGastosStats" style="grid-template-columns:repeat(3,1fr)"></div>
      <div class="card" style="margin-top:14px">
        <div class="card-header"><h3>Gastos por Categoría</h3></div>
        <div class="card-body" id="repGastosChart"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="card-header"><h3>Detalle de Gastos</h3></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Monto</th></tr></thead>
          <tbody id="repGastosTable"></tbody>
        </table></div>
      </div>
    </div>`;
  renderReporteVentas();
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('tabVentas').style.display = tab==='ventas'?'block':'none';
  document.getElementById('tabGastosR').style.display = tab==='gastosR'?'block':'none';
  if (tab==='ventas') renderReporteVentas();
  else renderReporteGastos();
}

function renderReporteVentas() {
  const desde = document.getElementById('repDesde')?.value||'';
  const hasta = document.getElementById('repHasta')?.value||'';
  const fs = DB.facturas.filter(f=>(!desde||f.fecha>=desde)&&(!hasta||f.fecha<=hasta));
  const total = fs.reduce((s,f)=>s+f.total,0);
  const prom = fs.length ? total/fs.length : 0;
  const stats = document.getElementById('repVentasStats');
  if (stats) stats.innerHTML = `
    <div class="stat-card"><div class="stat-icon">🧾</div><div class="stat-info"><h3>${fs.length}</h3><p>Facturas emitidas</p></div></div>
    <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-info"><h3>${fmt(total)}</h3><p>Total vendido</p></div></div>
    <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-info"><h3>${fmt(prom)}</h3><p>Venta promedio</p></div></div>`;
  const table = document.getElementById('repVentasTable');
  if (table) table.innerHTML = [...fs].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(f=>`
    <tr><td>${f.fecha}</td><td><strong>${f.numero}</strong></td><td>${f.clienteNombre}</td>
    <td>${f.items.length} items</td><td style="font-weight:700">${fmt(f.total)}</td><td>${f.pago}</td></tr>`).join('')
    || '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-light)">Sin ventas en el período</td></tr>';
}

function renderReporteGastos() {
  const gs = DB.gastos;
  const total = gs.reduce((s,g)=>s+g.monto,0);
  const compras = gs.filter(g=>g.tipo==='compra').reduce((s,g)=>s+g.monto,0);
  const operat = gs.filter(g=>g.tipo==='gasto').reduce((s,g)=>s+g.monto,0);
  const stats = document.getElementById('repGastosStats');
  if (stats) stats.innerHTML = `
    <div class="stat-card"><div class="stat-icon">💸</div><div class="stat-info"><h3>${fmt(total)}</h3><p>Total Gastos</p></div></div>
    <div class="stat-card"><div class="stat-icon">🛍️</div><div class="stat-info"><h3>${fmt(compras)}</h3><p>Compras Inventario</p></div></div>
    <div class="stat-card"><div class="stat-icon">🏢</div><div class="stat-info"><h3>${fmt(operat)}</h3><p>Gastos Operativos</p></div></div>`;
  const cats = { inventario:'Inventario', nomina:'Nómina', impuestos:'Impuestos', papeleria:'Papelería', servicios:'Servicios', arriendo:'Arriendo', varios:'Varios' };
  const byCat = {};
  gs.forEach(g=>{ byCat[g.cat]=(byCat[g.cat]||0)+g.monto; });
  const maxC = Math.max(...Object.values(byCat),1);
  const chart = document.getElementById('repGastosChart');
  if (chart) chart.innerHTML = Object.entries(byCat).map(([cat,monto])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:110px;font-size:12.5px;font-weight:600;text-align:right">${cats[cat]||cat}</div>
      <div style="flex:1;background:var(--bg);border-radius:6px;height:26px;overflow:hidden">
        <div style="height:100%;width:${Math.round(monto/maxC*100)}%;background:var(--blue);border-radius:6px;display:flex;align-items:center;padding-left:8px;color:white;font-size:11.5px;font-weight:700;min-width:60px">${fmt(monto)}</div>
      </div>
    </div>`).join('') || '<p style="color:var(--text-light)">Sin gastos registrados</p>';
  const table = document.getElementById('repGastosTable');
  if (table) table.innerHTML = [...gs].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(g=>`
    <tr><td>${g.fecha}</td><td><span class="badge ${g.tipo==='compra'?'badge-blue':'badge-amber'}">${g.tipo==='compra'?'Compra':'Gasto'}</span></td>
    <td>${cats[g.cat]||g.cat}</td><td>${g.desc}</td><td style="font-weight:700;color:var(--red)">${fmt(g.monto)}</td></tr>`).join('')
    || '<tr><td colspan="5" style="text-align:center;padding:20px">Sin gastos</td></tr>';
}

// Close dropdowns on click outside
document.addEventListener('click', e => {
  if (!e.target.closest('.search-product-wrap')) {
    document.querySelectorAll('.dropdown-products').forEach(d=>d.style.display='none');
  }
});

// Pull from sheets on load
window.addEventListener('load', () => {
  setTimeout(pullFromSheets, 1000);
});
</script>
